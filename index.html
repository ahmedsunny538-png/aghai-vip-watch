<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a19"><link rel="manifest" href="manifest.json"><title>AGHAI Islamic Smart Clock</title><style>
:root{--bg:#071a19;--p:#102c28;--g:#e6c477;--m:#8bd5bc;--t:#f4f3e9;--l:#31534b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#245148,var(--bg) 60%);color:var(--t);font:15px system-ui}header{padding:15px 18px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#071a19ed}h1{font-size:18px;color:var(--g);margin:0;letter-spacing:2px}small,.muted{color:#a9bdb5}.wrap{max-width:1000px;margin:auto;padding:14px}.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}.card{background:linear-gradient(145deg,#12312d,#0c211f);border:1px solid var(--l);border-radius:18px;padding:17px;margin-bottom:12px}.center{text-align:center}.time{font-size:clamp(48px,10vw,82px);color:var(--g);font-weight:300;font-variant-numeric:tabular-nums}.hijri{color:var(--m);font-size:20px;margin-top:8px}.world{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.world div{background:#0a211e;border-radius:12px;padding:10px}.world strong{display:block;color:var(--g);font-size:20px}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0}.tabs button{white-space:nowrap}.active,.gold{background:var(--g)!important;color:#14211c!important;font-weight:bold}button,input,select{font:inherit}button{background:#153832;color:var(--t);border:1px solid var(--l);padding:10px 13px;border-radius:11px}input,select{background:#081c19;color:white;border:1px solid var(--l);padding:11px;border-radius:10px;width:100%;margin:6px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{background:#102824;border:1px solid var(--l);border-radius:14px;padding:13px}.tile b{color:var(--m)}.arabic{font-size:27px;line-height:1.9;text-align:right;color:#f4dfaa}.item{padding:12px 0;border-bottom:1px solid var(--l)}.note{font-size:12px;color:#a9bdb5;line-height:1.6}.compass{width:160px;height:160px;border:2px solid var(--g);border-radius:50%;margin:15px auto;position:relative}.needle{position:absolute;top:25px;left:78px;width:4px;height:55px;background:linear-gradient(#e55,#eee);transform-origin:bottom}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}footer{text-align:center;color:#91aaa0;padding:20px;font-size:12px}@media(max-width:680px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><div><h1>AGHAI ISLAMIC SMART CLOCK</h1><small>WORLD TIME · HIJRI · DUAS · TASBEEH</small></div><button id="fs">Full Screen</button></header><main class="wrap"><div class="hero"><section class="card center"><div class="muted" id="zone">LOCAL TIME</div><div class="time" id="time">--:--:--</div><div id="greg"></div><div class="hijri" id="hijri"></div><small id="day"></small></section><section class="card"><h3 style="color:var(--g)">World Clock</h3><div class="world" id="world"></div></section></div><div class="grid"><div class="tile"><b>Hijri Date</b><div id="hijri2">--</div><small class="note">Moon sighting may change date</small></div><div class="tile"><b>Qibla Bearing</b><div id="qibla">Enable location</div></div><div class="tile"><b>Compass</b><div id="heading">--°</div></div></div><nav class="tabs" id="tabs"><button class="active" data="home">Home</button><button data="duas">Dua Book</button><button data="tasbeeh">Tasbeeh</button><button data="compass">Qibla</button><button data="alarm">Alarm</button><button data="calc">Calculator</button><button data="settings">Settings</button></nav><section class="card" id="content"></section><footer>AGHAI · Islamic Smart Clock · Confirm religious matters with a qualified scholar.</footer></main>
<script>
const $=x=>document.getElementById(x),tz=Intl.DateTimeFormat().resolvedOptions().timeZone;const cities=[['Karachi','Asia/Karachi'],['Makkah','Asia/Riyadh'],['Madina','Asia/Riyadh'],['Dubai','Asia/Dubai'],['Delhi','Asia/Kolkata'],['London','Europe/London'],['New York','America/New_York'],['Istanbul','Europe/Istanbul'],['Tokyo','Asia/Tokyo']];function f(d,z,o){return new Intl.DateTimeFormat('en-GB',{timeZone:z,...o}).format(d)}function tick(){let d=new Date();$('time').textContent=f(d,tz,{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});$('greg').textContent=f(d,tz,{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('zone').textContent='LOCAL TIME · '+tz;try{$('hijri').textContent=f(d,tz,{calendar:'islamic-umalqura',day:'numeric',month:'long',year:'numeric'})+' AH';$('hijri2').textContent=$('hijri').textContent}catch(e){}$('world').innerHTML=cities.map(([n,z])=>'<div>'+n+'<strong>'+f(d,z,{hour:'2-digit',minute:'2-digit',hour12:true})+'</strong><small>'+f(d,z,{day:'numeric',month:'short'})+'</small></div>').join('')}tick();setInterval(tick,1000);
const duas=[['Dua-e-Qunoot','اللَّهُمَّ إِنَّا نَسْتَعِينُكَ وَنَسْتَغْفِرُكَ وَنُؤْمِنُ بِكَ وَنَتَوَكَّلُ عَلَيْكَ وَنُثْنِي عَلَيْكَ الْخَيْرَ','Allahumma inna nastaeenuka wa nastaghfiruka wa numinu bika wa natawakkalu alayka wa nuthni alaykal-khayr.'],['Before eating','بِسْمِ اللَّهِ','Bismillah'],['After eating','الْحَمْدُ لِلَّهِ','Alhamdulillah'],['Before sleeping','بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا','Bismika Allahumma amutu wa ahya'],['Istighfar','أَسْتَغْفِرُ اللَّهَ','Astaghfirullah'],['Salawat','اللَّهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ','Allahumma salli ala Muhammad'],['Ayat-ul-Kursi (opening)','اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ','Allahu la ilaha illa huwal-hayyul-qayyum']];let tab='home',count=0,alarm=null;function render(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab||b.getAttribute('data')===tab));let c=$('content');if(tab==='home')c.innerHTML='<h3 style="color:var(--g)">Welcome</h3><p>One place for world time, Hijri date, daily duas and useful tools.</p><p class="note">Hijri dates are calculated estimates. Local moon-sighting announcements take priority. Prayer times and live fatwa service are not included in this starter release.</p>';
if(tab==='duas')c.innerHTML='<h3 style="color:var(--g)">Dua Book</h3><input id="search" placeholder="Search duas..."><div id="list"></div><h3 style="color:var(--g)">Islamic Basics</h3><div class="item">Five pillars: Shahadah, Salah, Zakah, Sawm and Hajj.</div><div class="item">Six articles of faith: Allah, angels, books, messengers, Last Day and divine decree.</div>';if(tab==='duas'){let fill=q=> $('list').innerHTML=duas.filter(x=>x.join(' ').toLowerCase().includes(q.toLowerCase())).map(x=>'<div class="item"><b>'+x[0]+'</b><div class="arabic" dir="rtl">'+x[1]+'</div><div class="note">'+x[2]+'</div></div>').join('');fill('');$('search').oninput=e=>fill(e.target.value)}
if(tab==='tasbeeh')c.innerHTML='<h3 style="color:var(--g)">Digital Tasbeeh</h3><div class="center"><div class="time" id="cnt">'+count+'</div><button class="gold" style="font-size:22px;padding:22px 35px;border-radius:50%" id="tap">TAP</button><p><button id="minus">−1</button> <button id="reset">Reset</button></p><p>Choose zikr: <select><option>SubhanAllah</option><option>Alhamdulillah</option><option>Allahu Akbar</option><option>Astaghfirullah</option></select></p></div>';$('tap').onclick=()=>{$('cnt').textContent=++count};$('minus').onclick=()=>{$('cnt').textContent=count=Math.max(0,count-1)};$('reset').onclick=()=>{$('cnt').textContent=count=0};
if(tab==='compass')c.innerHTML='<h3 style="color:var(--g)">Qibla & Compass</h3><div class="compass"><div class="needle" id="needle"></div></div><div class="center"><b id="read">--°</b><p class="note">Allow location and compass permissions. Keep phone flat and calibrate it.</p><button class="gold" id="loc">Enable Location</button><p class="note" id="msg"></p></div>';$('loc')?.addEventListener('click',()=>navigator.geolocation?.getCurrentPosition(p=>{let a=p.coords.latitude*Math.PI/180,b=p.coords.longitude*Math.PI/180,m=21.4225*Math.PI/180,n=39.8262*Math.PI/180,y=Math.sin(n-b),x=Math.cos(a)*Math.tan(m)-Math.sin(a)*Math.cos(n-b),q=(Math.atan2(y,x)*180/Math.PI+360)%360;$('qibla').textContent=Math.round(q)+'°';$('msg').textContent='Qibla bearing: '+Math.round(q)+'°'},e=>$('msg').textContent='Location permission not available.'));
if(tab==='alarm')c.innerHTML='<h3 style="color:var(--g)">Local Alarm</h3><input type="time" id="at"><div class="row"><button class="gold" id="set">Set Alarm</button><button id="preview">Preview gentle tone</button><button id="stop">Stop</button></div><p class="note" id="am">Keep this page open; browser alarms may not work when closed.</p>';$('set')?.addEventListener('click',()=>{let v=$('at').value;if(!v)return;$('am').textContent='Alarm set for '+v+' device local time.';if(alarm)clearInterval(alarm);alarm=setInterval(()=>{let d=new Date();if(d.toTimeString().slice(0,5)===v){tone();$('am').textContent='Alarm ringing!'}},10000)});$('preview')?.addEventListener('click',tone);$('stop')?.addEventListener('click',()=>{clearInterval(alarm);$('am').textContent='Alarm stopped.'});
if(tab==='calc')c.innerHTML='<h3 style="color:var(--g)">Mini Calculator</h3><input id="disp" readonly value="0" style="font-size:25px;text-align:right"><div class="grid" style="grid-template-columns:repeat(4,1fr)">'+['7','8','9','/','4','5','6','*','1','2','3','-','0','.','C','+','='].map(k=>'<button data-k="'+k+'">'+k+'</button>').join('')+'</div>';$('content').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let d=$('disp'),k=b.dataset.k;if(k==='C')d.value='0';else if(k==='='){try{d.value=String(Function('return ('+d.value+')')())}catch(e){d.value='Error'}}else d.value=d.value==='0'?k:d.value+k});
if(tab==='settings')c.innerHTML='<h3 style="color:var(--g)">Clock Settings</h3><p>Background wallpaper</p><input type="file" id="wall" accept="image/*"><div class="row"><button data-theme="green">Emerald</button><button data-theme="blue">Midnight</button><button data-theme="sand">Sand</button></div><p class="note">Your wallpaper stays in this browser session. Install this website from your browser menu when hosted over HTTPS.</p>';$('wall')?.addEventListener('change',e=>{let f=e.target.files[0];if(f)document.body.style.background='linear-gradient(#071a1999,#071a1999),url('+URL.createObjectURL(f)+') center/cover fixed'});c.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{document.body.style.background=b.dataset.theme==='blue'?'radial-gradient(circle,#26335e,#050915)':b.dataset.theme==='sand'?'linear-gradient(135deg,#59452e,#101b19)':'radial-gradient(circle at top,#245148,#071a19 60%)'})}
function tone(){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=660;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1);o.stop(a.currentTime+1.1);o.onended=()=>a.close()}catch(e){}}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.getAttribute('data');render()});$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
